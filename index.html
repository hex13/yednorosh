<html>
<div id="app"></div>
<div id="keyboard-legend">
	<div><b>movement: </b> arrows</div>
	<div><b>fire: </b>hold space and press arrow to fire in specific direction</div>
</div>
<div>
energy: <div class="energy-wrapper">
	<div class="energy"></div>
</div>
<canvas></canvas>
<div class="joysticks">
	<div class="joystick-desc">drag to move
	<div class="joystick" id="joystick-movement"></div>
	</div>

	<div>drag to fire
	<div class="joystick" id="joystick-fire"></div>
	</div>
</div>

<script src="index.js"></script>
<style>
	body {
		font-family: sans-serif;
		font-size: 20px;
	}
	#keyboard-legend {
		display: inline-block;
		padding: 4px;
		border: 1px dotted grey;
	}
	canvas {
		background: #600;
	}
	* {
		user-select: none;
		 -webkit-user-select: none;
	}
	.energy-wrapper {
		border-radius: 4px;
		top: 0;
		width: 200px;
		height: 40px;
		border: 2px solid white;
		background: black;
	}
	.energy {
		border-radius: 4px;
		height: 40px;
		width: 200px;
		background: #9a75e1;
		transition: width 1s;
	}
	.joysticks {
		touch-action: none;
		display: flex;
		position: fixed;
		justify-content: space-between;
		bottom: 0;
		width: 100%;
		padding: 10px;
	}
	.joystick {
		width: 300px;
		height: 300px;
		background: #5b4487;
		border: 1px solid #aa3;
		border-radius: 50%;
	}
	.joystick:hover {
		background: #7257a7;
	}
	.joysticks {
		font-size: 40px;
		text-align: center;
	}
	.joysticks > div {
		padding: 20px;
	}
</style>
</html>
